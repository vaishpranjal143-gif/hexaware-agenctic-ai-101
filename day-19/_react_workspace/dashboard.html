<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hex Retail Returns Dashboard</title>
    <style>
      :root {
        --bg: #0b1020;
        --bg-elev: #121a2b;
        --card: rgba(18, 26, 43, 0.9);
        --border: rgba(148, 163, 184, 0.18);
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #60a5fa;
        --accept-bg: rgba(34, 197, 94, 0.16);
        --accept-text: #86efac;
        --accept-border: rgba(34, 197, 94, 0.35);
        --reject-bg: rgba(239, 68, 68, 0.16);
        --reject-text: #fca5a5;
        --reject-border: rgba(239, 68, 68, 0.35);
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at top, rgba(96, 165, 250, 0.12), transparent 35%),
          linear-gradient(180deg, #0b1020 0%, #09111b 100%);
        color: var(--text);
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      body {
        padding: 32px 20px 48px;
      }

      .container {
        max-width: 1180px;
        margin: 0 auto;
      }

      .header {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 28px;
      }

      .title-block h1 {
        margin: 0;
        font-size: clamp(1.8rem, 4vw, 2.8rem);
        letter-spacing: -0.03em;
      }

      .title-block p {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 0.98rem;
      }

      .refund-total {
        background: linear-gradient(180deg, rgba(96, 165, 250, 0.14), rgba(96, 165, 250, 0.08));
        border: 1px solid rgba(96, 165, 250, 0.22);
        border-radius: 18px;
        padding: 18px 20px;
        min-width: 240px;
        box-shadow: var(--shadow);
      }

      .refund-total .label {
        display: block;
        color: var(--muted);
        font-size: 0.82rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 8px;
      }

      .refund-total .value {
        font-size: clamp(1.8rem, 4vw, 2.4rem);
        font-weight: 700;
      }

      .toolbar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 24px;
      }

      .filter-btn {
        appearance: none;
        border: 1px solid var(--border);
        background: rgba(15, 23, 42, 0.75);
        color: var(--text);
        border-radius: 999px;
        padding: 10px 16px;
        cursor: pointer;
        font-size: 0.95rem;
        transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
      }

      .filter-btn:hover {
        transform: translateY(-1px);
        border-color: rgba(96, 165, 250, 0.4);
        background: rgba(30, 41, 59, 0.9);
      }

      .filter-btn.active {
        background: rgba(96, 165, 250, 0.18);
        border-color: rgba(96, 165, 250, 0.45);
        color: #dbeafe;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 18px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 18px;
        box-shadow: var(--shadow);
        transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
        backdrop-filter: blur(8px);
      }

      .card:hover {
        transform: translateY(-4px);
        border-color: rgba(148, 163, 184, 0.28);
        background: rgba(20, 29, 47, 0.96);
      }

      .card-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      .order-id {
        color: var(--accent);
        font-weight: 700;
        font-size: 0.92rem;
        letter-spacing: 0.03em;
      }

      .item-name {
        margin: 8px 0 0;
        font-size: 1.08rem;
        font-weight: 600;
        line-height: 1.35;
      }

      .badge {
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        border: 1px solid transparent;
        white-space: nowrap;
      }

      .badge.accept {
        background: var(--accept-bg);
        color: var(--accept-text);
        border-color: var(--accept-border);
      }

      .badge.reject {
        background: var(--reject-bg);
        color: var(--reject-text);
        border-color: var(--reject-border);
      }

      .meta {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 14px;
      }

      .meta-block {
        padding: 12px 14px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(148, 163, 184, 0.1);
      }

      .meta-label {
        color: var(--muted);
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 6px;
      }

      .meta-value {
        font-size: 1rem;
        font-weight: 600;
      }

      .reason {
        margin-top: 16px;
        color: #d1d5db;
        line-height: 1.5;
        font-size: 0.95rem;
      }

      .empty {
        padding: 26px;
        border-radius: 18px;
        border: 1px dashed rgba(148, 163, 184, 0.28);
        color: var(--muted);
        text-align: center;
        background: rgba(15, 23, 42, 0.45);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const returnsData = [
        {
          orderId: "HX-90455",
          item: "Hex Studio headphones",
          price: 129.99,
          ageDays: 12,
          faulty: true,
          decision: "ACCEPT",
          reason: "Faulty item is covered by the two-year warranty, so the return is accepted."
        },
        {
          orderId: "HX-90456",
          item: "Hex Buds Mk II",
          price: 59.0,
          ageDays: 34,
          faulty: false,
          decision: "REJECT",
          reason: "Non-faulty audio return is outside the 21-day return window."
        },
        {
          orderId: "HX-90457",
          item: "Hex Studio headphones",
          price: 129.99,
          ageDays: 6,
          faulty: false,
          decision: "ACCEPT",
          reason: "Non-faulty audio return is within 21 days of delivery, so it is accepted."
        },
        {
          orderId: "HX-90458",
          item: "Hex Desk Mic",
          price: 84.5,
          ageDays: 27,
          faulty: true,
          decision: "ACCEPT",
          reason: "Faulty item is covered by the two-year warranty, so the return is accepted."
        }
      ];

      const gbp = new Intl.NumberFormat("en-GB", {
        style: "currency",
        currency: "GBP"
      });

      function ReturnCard({ item }) {
        const badgeClass = item.decision === "ACCEPT" ? "badge accept" : "badge reject";

        return (
          <article className="card">
            <div className="card-top">
              <div>
                <div className="order-id">{item.orderId}</div>
                <h2 className="item-name">{item.item}</h2>
              </div>
              <span className={badgeClass}>{item.decision}</span>
            </div>

            <div className="meta">
              <div className="meta-block">
                <div className="meta-label">Price</div>
                <div className="meta-value">{gbp.format(item.price)}</div>
              </div>
              <div className="meta-block">
                <div className="meta-label">Age</div>
                <div className="meta-value">{item.ageDays} days</div>
              </div>
            </div>

            <p className="reason">{item.reason}</p>
          </article>
        );
      }

      function Dashboard() {
        const [filter, setFilter] = React.useState("All");

        const filteredReturns = returnsData.filter((entry) => {
          if (filter === "Accepted") return entry.decision === "ACCEPT";
          if (filter === "Rejected") return entry.decision === "REJECT";
          return true;
        });

        const totalRefund = returnsData
          .filter((entry) => entry.decision === "ACCEPT")
          .reduce((sum, entry) => sum + entry.price, 0);

        const filters = ["All", "Accepted", "Rejected"];

        return (
          <div className="container">
            <header className="header">
              <div className="title-block">
                <h1>Hex Retail Returns Dashboard</h1>
                <p>Live decisions based on Hex Retail returns policy for audio products and faulty goods.</p>
              </div>
              <div className="refund-total">
                <span className="label">Total GBP Refunded</span>
                <span className="value">{gbp.format(totalRefund)}</span>
              </div>
            </header>

            <div className="toolbar">
              {filters.map((option) => (
                <button
                  key={option}
                  className={`filter-btn ${filter === option ? "active" : ""}`}
                  onClick={() => setFilter(option)}
                >
                  {option}
                </button>
              ))}
            </div>

            {filteredReturns.length > 0 ? (
              <section className="grid">
                {filteredReturns.map((entry) => (
                  <ReturnCard key={entry.orderId} item={entry} />
                ))}
              </section>
            ) : (
              <div className="empty">No returns match the current filter.</div>
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<Dashboard />);
    </script>
  </body>
</html>
